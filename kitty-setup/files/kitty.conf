# kitty.conf — only what we changed from kitty's defaults. Installed by `/dev-tools kitty`;
# edit it in the claude-skills repo (kitty-setup/files/), not in ~/.config/kitty.

# --- Appearance ---
# Nerd Font so prompt/statusline glyphs render; installed by the skill (font-jetbrains-mono-nerd-font).
font_family      JetBrainsMono Nerd Font
font_size        14.0
# Breathing room between text and window edge (default 0).
window_padding_width 8
# No beep on BEL — Claude Code and shells ring it often.
enable_audio_bell no
# Theme managed by `kitty +kitten themes`, which rewrites this block; the colours live in
# current-theme.conf (Dracula).
# BEGIN_KITTY_THEME
# Dracula
include current-theme.conf
# END_KITTY_THEME

# --- Performance ---
# Repaint at most every 15 ms instead of 10: less CPU/battery while a TUI streams output.
repaint_delay 15

# --- macOS ---
# Option acts as Alt, so alt+b / alt+f word-jumps and Alt chords work in zsh and Claude Code.
macos_option_as_alt yes
# Closing the last window quits kitty instead of leaving it in the Dock.
macos_quit_when_last_window_closed yes
# No "are you sure?" prompt when closing a window with a running process.
confirm_os_window_close 0

# --- Splits ---
# splits for arbitrary panes, stack to zoom one pane full-window.
enabled_layouts splits,stack
# cmd+d / cmd+shift+d split side-by-side / stacked, opening in the current pane's directory.
map cmd+d       launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
# Even out pane sizes after resizing.
map ctrl+shift+e layout_action equalize
# ctrl+shift+p then d: label every #N and github.com PR URL on screen; the one picked opens in
# kitten diff over this pane (q closes it). #N resolves against the pane's repo. Script: pr-diff.sh.
map ctrl+shift+p>d kitten hints --type=regex --regex '(?:https://github\.com/[\w.-]+/[\w.-]+/pull/\d+|#\d+)' --program 'launch --type=overlay --cwd=current ~/.config/kitty/pr-diff.sh'
# Unbind kitty's cmd+enter (new window) so it doesn't fire by accident.
map cmd+enter     no_op
# Move focus between panes.
map cmd+alt+left  neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up    neighboring_window up
map cmd+alt+down  neighboring_window down

# --- Line navigation ---
# cmd+left / cmd+right jump to line start / end, like a macOS text field (readline ctrl+a / ctrl+e).
map cmd+left  send_text all \x01
map cmd+right send_text all \x05

# --- Claude Code ---
# Both maps fire only while the `claude()` wrapper in ~/.zshrc has set the in_claude user var.
# cmd+v sends ctrl+v, Claude Code's image-paste key, so a copied screenshot pastes as an image.
map --when-focus-on var:in_claude cmd+v send_key ctrl+v
# cmd+backspace clears Claude Code's input without interrupting a running turn: 2000
# forward-deletes then 2000 backspaces (up to 2000 chars each side of the cursor). Not esc esc
# (interrupts the turn), nor a ctrl+k/ctrl+u mix (Claude drops some keys of a mixed burst).
map --when-focus-on var:in_claude cmd+backspace send_text all \x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3~\x1b[3